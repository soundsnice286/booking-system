<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂位，好像不錯。</title>
    <style>
        :root { --primary: #333; --bg: #f9f9f9; --danger: #d9534f; --success: #28a745; --notice-bg: #8b0000; --coffee: #4e342e; }
        body { font-family: sans-serif; background: var(--bg); color: var(--primary); max-width: 450px; margin: 20px auto; padding: 20px; line-height: 1.6; }
        h2 { text-align: center; letter-spacing: 2px; }
        
        #full-alert { display: none; background: #fff1f0; border: 1px solid #ffa39e; color: var(--danger); padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        
        .info-box { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 8px; font-size: 14px; margin-bottom: 25px; text-align: left; }
        .info-box h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .info-box ul { list-style: none; padding-left: 0; margin: 0; }
        .info-box li { margin-bottom: 10px; line-height: 1.6; display: flex; }
        
        /* 讓標題與內容分開，達成對齊效果 */
        .info-box li .title { font-weight: bold; white-space: nowrap; flex-shrink: 0; }
        .info-box li .content { flex-grow: 1; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        select, input, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; margin-bottom: 25px; font-weight: bold; cursor: pointer; text-align: left; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }

        .submit-notice { background: var(--notice-bg); color: #fff; padding: 15px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; text-align: left; line-height: 1.5; }
        
        button { background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        .success-action-area { text-align: center; margin-top: 25px; }
        .ig-btn { background: var(--coffee); color: #fff; text-decoration: none; display: inline-block; width: 80%; padding: 12px 20px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; transition: 0.3s; text-align: left; box-sizing: border-box; }
        .ig-btn:hover { opacity: 0.9; }
        .home-btn { background: var(--primary); color: #fff; width: 80%; display: inline-block; border-radius: 6px; }

        .status-tag { font-size: 12px; margin-left: 8px; }
        .full { color: var(--danger); }
        .footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 40px; }

        #booking-form { display: block; }
        #success-view { display: none; text-align: left; padding: 30px; background: #fff; border-radius: 8px; border: 1px solid #eee; }
        .success-msg { font-size: 18px; font-weight: bold; color: var(--success); margin-bottom: 20px; text-align: center; }
    </style>
</head
