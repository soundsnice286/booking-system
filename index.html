<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂位，好像不錯。</title>
    <style>
        body { font-family: -apple-system, sans-serif; color: #333; max-width: 500px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px; }
        ul { padding-left: 20px; font-size: 0.95rem; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: inline-block; font-weight: bold; margin-bottom: 5px; }
        .full-hint { color: #d93025; font-size: 0.85rem; font-weight: normal; margin-left: 10px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .checkbox-container { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; font-size: 0.9rem; }
        .checkbox-container input { width: auto; margin-top: 5px; }
        button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #result-area { display: none; padding: 40px 0; }
        .footer { text-align: center; margin-top: 60px; font-size: 0.8rem; }
        .ig-button { display: inline-block; background-color: #f2f2f2; color: #555; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: 500; margin-bottom: 15px; border: 1px solid #e0e0e0; }
    </style>
</head>
<body>

<div id="booking-form">
    <h2>訂位，好像不錯。</h2>
    <div class="notice-header">
        <p style="font-weight: bold; color: #5D4037;">
            5/1 開放預約，採「時段預約制」。
        </p>
    </div>    
    <div class="section">
        <h3>📅 預約須知</h3>
        <ul>
            <li>訂位成立：請確保 IG 帳號填寫正確。收到私訊後，須在 <b>24 小時內回覆</b>。</li>
            <li>座位保留：僅保留 <b>10 分鐘</b>。</li>
            <li>用餐時間：僅限預約時段內，無法延長加時。</li>
            <li>人數規範：每組最多 6 位，恕無接待 8 歲以下兒童。</li>
            <li>最低消費：每人 <b>NT.160元</b>。</li>
        </ul>
    </div>

    <div class="form-group">
        <label>日期</label>
        <select id="date" onchange="updateOptions()">
            <option value="2026-05-01" selected>2026-05-01 (週五)</option>
        </select>
    </div>

    <div class="form-group">
        <label>時段</label>
        <select id="time" onchange="updateGuestOptions()"></select>
    </div>

    <div class="form-group">
        <label>預約人數</label>
        <span id="waitlist-info" class="full-hint"></span>
        <select id="guests" onchange="updateButtonText()"></select>
    </div>

    <div class="form-group">
        <label>姓名</label>
        <input type="text" id="name">
    </div>

    <div class="form-group">
        <label>Instagram 帳號</label>
        <input type="text" id="ig" placeholder="@">
    </div>

    <div class="checkbox-container">
        <input type="checkbox" id="agree" onchange="handleAgreeChange()">
        <label for="agree">訂位即為同意上述須知。</label>
    </div>

    <button id="submit-btn" disabled onclick="submitForm()">確認訂位</button>
</div>

<div id="result-area">
    <h2 id="res-title" style="text-align:center;">資料送出成功。</h2>
    <div class="center-btn" style="text-align:center; margin-top:30px;">
        <button onclick="location.reload()" style="background:#666; width: auto; padding: 10px 40px;">返回首頁</button>
    </div>
</div>

<div class="footer">
    <a href="https://www.instagram.com/soundsnice.obj/" target="_blank" class="ig-button">好像不錯的 Instagram</a>
    <p>© 2026 Sounds Nice.</p>
</div>

<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyEzzPGdhd1Opeubu3gZGwHInUE6mRYgg2fVlnBP8U18g4FA98a6GVw8t13-0-XrGEheA/exec'; 
    let apiData = { bookedData: {}, limits: { single: 2, small: 5, large: 3, fiveSix: 2 } };

    window.onload = async () => {
        try {
            const res = await fetch(GAS_URL);
            if(res.ok) apiData = await res.json();
        } catch (e) { console.log("使用預設配置"); }
        updateOptions();
    };

    function updateOptions() {
        const dateSelect = document.getElementById('date');
        const dateVal = dateSelect.value;
        const timeSelect = document.getElementById('time');
        const btn = document.getElementById('submit-btn');
        
        timeSelect.innerHTML = '';
        
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        const currentTime = now.getHours() * 100 + now.getMinutes();
        
        // 截止判斷：過去日期 或 當天下午 3 點後
        const shouldLock = (dateVal < todayStr) || (dateVal === todayStr && currentTime >= 1500);

        if (shouldLock) {
            timeSelect.add(new Option("預約已截止，只接受現場候位。", "")); // 需求 2
            btn.disabled = true;
            btn.innerText = "預約截止";
            return;
        }

        btn.innerText = "確認訂位";
        // 需求 8：5/1 三個時段
        let sessions = ["16:30~19:00", "19:15~21:45", "22:00~00:30"];

        sessions.forEach(s => {
            const booked = (apiData.bookedData[dateVal] && apiData.bookedData[dateVal][s]) ? 
                          apiData.bookedData[dateVal][s] : { small: 0, large: 0 };
            const isFull = (booked.small >= apiData.limits.small && booked.large >= apiData.limits.large);
            timeSelect.add(new Option(isFull ? `${s} (額滿可候補)` : s, s));
        });
        
        updateGuestOptions();
        handleAgreeChange(); 
    }

    function updateGuestOptions() {
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const guestsSel = document.getElementById('guests');
        if (!time || time.includes("截止")) return;

        const booked = (apiData.bookedData[date] && apiData.bookedData[date][time]) || { single: 0, small: 0, large: 0, fiveSix: 0 };
        const lim = apiData.limits;
        guestsSel.innerHTML = "";
        for(let i=1; i<=6; i++) {
            let isFull = false;
            if(i === 1) { if(booked.single >= lim.single || booked.small >= lim.small) isFull = true; }
            else if(i === 2) { if(booked.small >= lim.small) isFull = true; }
            else if(i >= 3 && i <= 4) { if(booked.large >= lim.large) isFull = true; }
            else if(i >= 5) { if(booked.fiveSix >= lim.fiveSix || booked.large >= lim.large) isFull = true; }
            let label = i + " 位" + (i===1?" (吧檯)":"");
            let option = new Option(isFull ? label + " (候補)" : label, i);
            if(isFull) option.dataset.waitlist = "true";
            guestsSel.add(option);
        }
        updateButtonText();
    }

    function updateButtonText() {
        const btn = document.getElementById('submit-btn');
        const info = document.getElementById('waitlist-info');
        const selected = document.getElementById('guests').selectedOptions[0];
        if (btn.innerText === "預約截止") return;
        if (selected && selected.dataset.waitlist === "true") {
            info.innerText = `• 該選項額滿可候補`;
            btn.innerText = "我要候補";
        } else {
            info.innerText = "";
            btn.innerText = "確認訂位";
        }
    }

    function handleAgreeChange() {
        const btn = document.getElementById('submit-btn');
        if (btn.innerText !== "預約截止") btn.disabled = !document.getElementById('agree').checked;
    }

    async function submitForm() {
        const btn = document.getElementById('submit-btn');
        const payload = {
            date: document.getElementById('date').value,
            time: document.getElementById('time').value,
            guests: document.getElementById('guests').value,
            name: document.getElementById('name').value,
            ig: document.getElementById('ig').value
        };
        if(!payload.name || !payload.ig) { alert("請填寫姓名與 IG"); return; }
        btn.disabled = true;
        btn.innerText = "處理中...";
        try {
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            document.getElementById('booking-form').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
        } catch(e) { alert("失敗"); btn.disabled = false; }
    }
</script>
</body>
</html>
