<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂位，好像不錯。</title>
    <style>
        :root { --primary: #333; --bg: #f9f9f9; --danger: #d9534f; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--primary); max-width: 450px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        h2 { text-align: center; letter-spacing: 2px; margin-bottom: 10px; }
        
        .info-box { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 25px; color: #666; }
        .info-title { font-weight: bold; color: var(--primary); display: block; margin-bottom: 5px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        select, input, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        button { background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #555; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        .status-tag { font-size: 12px; font-weight: normal; margin-left: 8px; }
        .full { color: var(--danger); font-weight: bold; }
        .success-text { color: #28a745; }
        .footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 40px; }
    </style>
</head>
<body>

    <h2>訂位，好像不錯。</h2>

    <div class="info-box">
        <span class="info-title">/ 訂位說明 /</span>
        1. 填寫表單後請留意 IG 私訊。<br>
        2. 經我們回覆訊息確認後，訂位才正式成立。<br>
        3. 若人數選項顯示「已滿」，代表該時段名額已達上限。
    </div>

    <div class="form-group">
        <label>日期</label>
        <select id="date" onchange="checkAvailability()">
            <option value="2026-02-19">2026-02-19 (週四)</option>
            <option value="2026-02-28">2026-02-28 (週六)</option>
        </select>
    </div>

    <div class="form-group">
        <label>時段</label>
        <select id="time" onchange="checkAvailability()">
            <option value="17:30~20:30">17:30 ~ 20:30</option>
            <option value="21:30~12:30">21:30 ~ 12:30</option>
        </select>
    </div>

    <div class="form-group">
        <label>預約人數 <span id="seat-status" class="status-tag"></span></label>
        <select id="guests" onchange="validateChoice()">
            <option value="1">1 位</option>
            <option value="2">2 位</option>
            <option value="3">3 位</option>
            <option value="4">4 位</option>
            <option value="5">5 位</option>
            <option value="6">6 位</option>
        </select>
    </div>

    <div class="form-group">
        <label>姓名</label>
        <input type="text" id="name" placeholder="如何稱呼您">
    </div>

    <div class="form-group">
        <label>Instagram 帳號</label>
        <input type="text" id="ig" placeholder="請輸入正確帳號以便私訊">
    </div>

    <button id="submit-btn" onclick="submitBooking()" disabled>讀取名額中...</button>

    <div class="footer">© 2026 Sounds Nice.</div>

    <script>
        // 已更新為你的 GAS 連結
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwcFnJ0ffLObSaH_HZLyzrG56oQIpk7rz6GIC-HQolsmVrW0rBMwYstb9qON_OLHU6cIg/exec';
        let currentStats = null;

        // 初始化
        window.onload = checkAvailability;

        async function checkAvailability() {
            const status = document.getElementById('seat-status');
            const btn = document.getElementById('submit-btn');
            status.innerText = "(名額確認中...)";
            btn.disabled = true;

            try {
                const res = await fetch(GAS_URL);
                currentStats = await res.json();
                validateChoice(); // 取得數據後立即執行驗證
            } catch (e) {
                status.innerText = "(連線失敗，請重新整理)";
            }
        }

        function validateChoice() {
            if (!currentStats) return;

            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const guests = parseInt(document.getElementById('guests').value);
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('seat-status');

            const dayData = currentStats.bookedData[date] || {};
            const booked = dayData[time] || { small: 0, large: 0, six: 0 };

            let isFull = false;
            let msg = "";

            // 執行規則判定
            if ((guests === 1 || guests === 2) && booked.small >= currentStats.limits.small) {
                isFull = true;
                msg = "1-2位已額滿";
            } else if (guests >= 3 && guests < 6 && booked.large >= currentStats.limits.large) {
                isFull = true;
                msg = "3位以上已額滿";
            } else if (guests === 6) {
                if (booked.six >= currentStats.limits.six) {
                    isFull = true;
                    msg = "6位僅限一組，已額滿";
                } else if (booked.large >= currentStats.limits.large) {
                    isFull = true;
                    msg = "時段已額滿";
                }
            }

            if (isFull) {
                status.innerHTML = `<span class="full">● ${msg}</span>`;
                btn.disabled = true;
                btn.innerText = "此時段人數已滿";
            } else {
                status.innerHTML = `<span class="success-text">● 尚有名額</span>`;
                btn.disabled = false;
                btn.innerText = "提交訂位申請";
            }
        }

        async function submitBooking() {
            const name = document.getElementById('name').value;
            const ig = document.getElementById('ig').value;
            if (!name || !ig) { alert("請填寫姓名與 IG 帳號"); return; }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "申請傳送中...";

            const payload = {
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                guests: document.getElementById('guests').value,
                name: name,
                ig: ig
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.result === 'success') {
                    alert("申請已成功送出！\n請注意您的 IG 私訊，我們回覆確認後訂位才成立。");
                    location.reload();
                } else {
                    alert("錯誤：" + result.message);
                    checkAvailability();
                }
            } catch (e) {
                alert("系統繁忙，請稍後再試");
                btn.disabled = false;
                btn.innerText = "提交訂位申請";
            }
        }
    </script>
</body>
</html>
