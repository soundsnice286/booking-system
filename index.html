<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂位，好像不錯。</title>
    <style>
        body { font-family: -apple-system, sans-serif; color: #333; max-width: 500px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px; }
        ul { padding-left: 20px; font-size: 0.95rem; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: inline-block; font-weight: bold; margin-bottom: 5px; }
        .full-hint { color: #d93025; font-size: 0.85rem; font-weight: normal; margin-left: 10px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .checkbox-container { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; font-size: 0.9rem; }
        .checkbox-container input { width: auto; margin-top: 5px; }
        button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #result-area { display: none; padding: 40px 0; text-align: center; }
        .res-content-wrapper { text-align: left; max-width: 350px; margin: 0 auto; line-height: 1.8; font-size: 1rem; }
        .footer { text-align: center; margin-top: 60px; font-size: 0.8rem; }
        .ig-button { display: inline-block; background-color: #f2f2f2; color: #555; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: 500; border: 1px solid #e0e0e0; }
    </style>
</head>
<body>
<div id="booking-form">
    <h2>訂位，好像不錯。</h2>
    
    <div class="section">
        <p style="font-weight: bold; color: #5D4037;">採「時段預約制」。</p>
        <h3>📝 預約三步驟</h3>
        <ol>
            <li>閱讀須知與填寫資料。</li>
            <li>留意 IG 訊息，收到後於 24 小時內回覆。</li>
            <li>IG 收取訂位成立訊息。</li>
        </ol>
    </div>

    <div class="form-group">
        <label>日期</label>
        <select id="date" onchange="updateOptions()">
            <option value="2026-05-01">2026-05-01 (週五)</option>
            </select>
    </div>

    <div class="form-group">
        <label>時段</label>
        <select id="time" onchange="updateGuestOptions()"></select>
    </div>

    <div class="form-group">
        <label>預約人數 <span id="waitlist-info" class="full-hint"></span></label>
        <select id="guests" onchange="updateButtonText()"></select>
    </div>

    <div class="form-group">
        <label>姓名</label>
        <input type="text" id="name">
    </div>

    <div class="form-group">
        <label>Instagram 帳號</label>
        <input type="text" id="ig" placeholder="@">
    </div>

    <div class="checkbox-container">
        <input type="checkbox" id="agree" onchange="handleAgreeChange()">
        <label for="agree">訂位即為同意上述「訂位須知」與「用餐須知」。</label>
    </div>

    <button id="submit-btn" disabled onclick="submitForm()">確認訂位</button>
</div>

<div id="result-area">
    <h2 id="res-title">資料送出成功</h2>
    <div id="res-success" class="res-content-wrapper">
        <p>請留意 IG 私訊。<br>收到私訊後，請在 <b>24小時</b> 內回覆，訂位才會正式成立。</p>
    </div>
    <div id="res-waitlist" class="res-content-wrapper" style="display:none;">
        <p>您好，如有釋出位置會盡快透過 IG 通知。<br>若沒有位置的話就不會另行通知。</p>
    </div>
    <button onclick="location.reload()" style="background:#666; width: auto; padding: 10px 40px; margin-top:20px;">返回首頁</button>
</div>

<div class="footer">
    <a href="https://www.instagram.com/soundsnice.obj/" target="_blank" class="ig-button">好像不錯的 Instagram</a>
    <p>© 2026 Sounds Nice.</p>
</div>

<script>
    // 【SSR 注入數據】
    let apiData;
    try {
        apiData = JSON.parse(<?!= initialData ?>);
    } catch (e) {
        apiData = { bookedData: {}, limits: { single: 2, small: 5, large: 3, fiveSix: 2 } };
    }

    // 替換為你的網頁部署網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxji5AKFzm1bHz39wEejJO3bIR_NEwT0U-06M99SmuVCgTkxQQshGa8XSWAmD8PThyv/exec'; 

    window.onload = () => {
        updateOptions();
    };

    function updateOptions() {
        const dateVal = document.getElementById('date').value;
        const timeSelect = document.getElementById('time');
        timeSelect.innerHTML = '<option value="">請選擇時段</option>';
        
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        
        // 三點截止邏輯
        if (dateVal === todayStr && now.getHours() >= 15) {
            timeSelect.innerHTML = '<option value="">今日預約已截止</option>';
            document.getElementById('submit-btn').innerText = "預約截止";
            document.getElementById('submit-btn').disabled = true;
            return;
        }

        const sessions = ["16:30~19:00", "19:15~21:45", "22:00~00:30"];
        sessions.forEach(s => {
            const booked = (apiData.bookedData[dateVal] && apiData.bookedData[dateVal][s]) || { small: 0, large: 0 };
            const isFull = (booked.small >= apiData.limits.small && booked.large >= apiData.limits.large);
            timeSelect.add(new Option(isFull ? `${s} (額滿候補)` : s, s));
        });
        updateGuestOptions();
    }

    function updateGuestOptions() {
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const guestsSel = document.getElementById('guests');
        guestsSel.innerHTML = "";
        
        if (!time || time.includes("截止")) {
            guestsSel.add(new Option("請先選擇時段", ""));
            return;
        }
        
        const booked = (apiData.bookedData[date] && apiData.bookedData[date][time]) || { single: 0, small: 0, large: 0, fiveSix: 0 };
        const lim = apiData.limits;
        
        for(let i=1; i<=6; i++) {
            let isFull = false;
            if(i === 1) { if(booked.single >= lim.single || booked.small >= lim.small) isFull = true; }
            else if(i === 2) { if(booked.small >= lim.small) isFull = true; }
            else if(i >= 3 && i <= 4) { if(booked.large >= lim.large) isFull = true; }
            else if(i >= 5) { if(booked.fiveSix >= lim.fiveSix || booked.large >= lim.large) isFull = true; }
            
            let label = i + " 位" + (i===1 ? " (吧檯座位)" : "");
            let opt = new Option(isFull ? label + " (候補)" : label, i);
            if(isFull) opt.dataset.waitlist = "true";
            guestsSel.add(opt);
        }
        updateButtonText();
        handleAgreeChange();
    }

    function updateButtonText() {
        const btn = document.getElementById('submit-btn');
        const info = document.getElementById('waitlist-info');
        const selected = document.getElementById('guests').selectedOptions[0];
        
        if (selected && selected.dataset.waitlist === "true") {
            info.innerText = "● 該人數已額滿";
            btn.innerText = "我要候補";
        } else {
            info.innerText = "";
            btn.innerText = "確認訂位";
        }
    }

    function handleAgreeChange() {
        const btn = document.getElementById('submit-btn');
        const agree = document.getElementById('agree').checked;
        const time = document.getElementById('time').value;
        if (btn.innerText !== "預約截止") {
            btn.disabled = !(agree && time && time !== "");
        }
    }

    async function submitForm() {
        const btn = document.getElementById('submit-btn');
        const payload = {
            date: document.getElementById('date').value,
            time: document.getElementById('time').value,
            guests: document.getElementById('guests').value,
            name: document.getElementById('name').value,
            ig: document.getElementById('ig').value
        };
        if(!payload.name || !payload.ig) { alert("請填寫姓名與 IG"); return; }
        
        btn.disabled = true;
        const isWaitlist = (btn.innerText === "我要候補");
        btn.innerText = "提交中...";

        try {
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            document.getElementById('booking-form').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            if(isWaitlist) {
                document.getElementById('res-title').innerText = "已登記候補";
                document.getElementById('res-success').style.display = 'none';
                document.getElementById('res-waitlist').style.display = 'block';
            }
        } catch(e) {
            alert("送出失敗");
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
