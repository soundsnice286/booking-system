<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂位，好像不錯。</title>
    <style>
        :root { --primary: #333; --bg: #f9f9f9; --danger: #d9534f; --success: #28a745; --notice-bg: #8b0000; --coffee: #4e342e; --wait: #f0ad4e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--primary); max-width: 450px; margin: 20px auto; padding: 20px; line-height: 1.6; }
        h2 { text-align: center; letter-spacing: 2px; margin-bottom: 30px; }
        .info-box { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 8px; font-size: 14px; margin-bottom: 25px; }
        .info-box h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        select, input, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; margin-bottom: 25px; font-weight: bold; cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; flex-shrink: 0; }
        .submit-notice { background: var(--notice-bg); color: #fff; padding: 15px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
        button { background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.wait-btn { background: var(--wait); }
        .status-tag { font-size: 12px; margin-left: 8px; }
        .full { color: var(--danger); }
        #success-view { display: none; padding: 30px; background: #fff; border-radius: 8px; border: 1px solid #eee; text-align: center; }
        .ig-btn { background: var(--coffee); color: #fff; text-decoration: none; display: block; padding: 12px; border-radius: 6px; margin: 20px 0; }
    </style>
</head>
<body>
    <div id="booking-form">
        <h2>訂位，好像不錯。</h2>
        <div class="info-box">
            <h3>📅 預約須知</h3>
            <p style="font-size:13px; margin:0;">請確保 IG 正確，私訊後須 24hr 內回覆。座位保留 15min。</p>
        </div>

        <div class="form-group">
            <label>日期</label>
            <select id="date" onchange="validateForm()">
                <option value="2026-02-19">2026-02-19 (週四)</option>
                <option value="2026-02-28">2026-02-28 (週六)</option>
            </select>
        </div>

        <div class="form-group">
            <label>時段 <span id="time-status" class="status-tag"></span></label>
            <select id="time" onchange="validateForm()">
                <option value="17:30~20:30">17:30~20:30</option>
                <option value="21:30~00:30">21:30~00:30</option>
            </select>
        </div>

        <div class="form-group">
            <label>人數 <span id="seat-status" class="status-tag"></span></label>
            <select id="guests" onchange="validateForm()">
                <option value="1">1 位 (吧檯)</option>
                <option value="2">2 位</option>
                <option value="3">3 位</option>
                <option value="4">4 位</option>
                <option value="5">5 位</option>
                <option value="6">6 位</option>
            </select>
        </div>

        <div class="form-group"><label>姓名</label><input type="text" id="name" oninput="validateForm()"></div>
        <div class="form-group"><label>IG 帳號</label><input type="text" id="ig" oninput="validateForm()"></div>

        <label class="checkbox-group"><input type="checkbox" id="agree" onchange="validateForm()"><span>同意訂位與用餐須知</span></label>
        <button id="submit-btn" onclick="handleAction()" disabled>請填寫資料</button>
    </div>

    <div id="success-view">
        <h3 style="color:var(--success)" id="res-title">送出成功</h3>
        <p id="res-msg">請靜候 IG 私訊確認。</p>
        <a href="https://www.instagram.com/soundsnice.obj/" class="ig-btn">前往 IG</a>
        <button onclick="location.reload()">返回</button>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzbCufWfjG_CPV19NnhmvyJQs1k5GkwkFFkvFld9QWhztxrgINBWQGPBV5WysM8j6AYfw/exec'; 
        let currentStats = null;
        let isWaitMode = false;

        async function init() {
            try {
                const res = await fetch(GAS_URL);
                currentStats = await res.json();
                validateForm();
            } catch (e) { document.getElementById('time-status').innerText = "連線失敗"; }
        }

        function validateForm() {
            if (!currentStats) return;
            const guests = parseInt(document.getElementById('guests').value);
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const isFull = checkFull(date, time, guests);
            
            const btn = document.getElementById('submit-btn');
            const seatStatus = document.getElementById('seat-status');
            
            isWaitMode = isFull;
            if (isFull) {
                seatStatus.innerHTML = `<span class="full">● 已額滿 (可登記候補)</span>`;
                btn.className = "wait-btn";
                btn.innerText = "登記候補";
            } else {
                seatStatus.innerHTML = `<span style="color:var(--success)">● 尚有名額</span>`;
                btn.className = "";
                btn.innerText = "提交預約";
            }

            const ready = document.getElementById('name').value.trim() && 
                          document.getElementById('ig').value.trim() && 
                          document.getElementById('agree').checked;
            btn.disabled = !ready;
        }

        function checkFull(d, t, g) {
            const booked = (currentStats.bookedData[d] || {})[t] || {single:0, small:0, large:0, fiveSix:0};
            if (g <= 2) {
                if (booked.small >= currentStats.limits.small) return true;
                if (g === 1 && booked.single >= currentStats.limits.single) return true;
            } else {
                if (booked.large >= currentStats.limits.large) return true;
                if (g >= 5 && booked.fiveSix >= currentStats.limits.fiveSix) return true;
            }
            return false;
        }

        async function handleAction() {
            if (isWaitMode && !confirm("此時段已滿，確定要登記候補嗎？\n(有位子會通知，沒位子則不另行告知)")) return;
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "處理中...";

            const payload = {
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                guests: document.getElementById('guests').value,
                name: document.getElementById('name').value,
                ig: document.getElementById('ig').value,
                isWaitlist: isWaitMode
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.result === 'success') {
                    document.getElementById('booking-form').style.display = 'none';
                    document.getElementById('success-view').style.display = 'block';
                    if (isWaitMode) {
                        document.getElementById('res-title').innerText = "候補登記成功";
                        document.getElementById('res-msg').innerText = "若有釋出名額會盡快私訊您。";
                    }
                }
            } catch (e) { alert("出錯了，請私訊 IG"); btn.disabled = false; }
        }

        init();
    </script>
</body>
</html>
