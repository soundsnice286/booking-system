<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約訂位系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8f9fa; }
        .booking-card { max-width: 500px; margin: 2rem auto; }
        #responseMessage { white-space: pre-wrap; }
    </style>
</head>
<body class="p-4">
    <div class="booking-card bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">預約訂位</h1>
        
        <form id="bookingForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">姓名</label>
                <input type="text" name="name" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">電話</label>
                <input type="tel" name="phone" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">訂位日期</label>
                <select name="date" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    <option value="02-19">2月19日</option>
                    <option value="02-20">2月20日</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">訂位類別</label>
                <div class="flex gap-4 mt-2">
                    <label><input type="radio" name="type" value="D" checked> 午場 (D)</label>
                    <label><input type="radio" name="type" value="N"> 晚場 (N)</label>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">人數</label>
                <input type="number" name="guests" value="1" min="1" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">備註</label>
                <textarea name="note" class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700">
                立即預約
            </button>
        </form>

        <div id="responseMessage" class="hidden mt-6 p-4 bg-gray-50 border rounded-lg text-sm text-gray-800"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyaI6e4araDaS02vgakwsx241WMZNsdEZdonDs3RfJrjBSoxXMwK0R4GPcoarp6tzOB/exec';
        const form = document.getElementById('bookingForm');
        const responseMessage = document.getElementById('responseMessage');

        form.addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = '處理中...';
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(res => res.json())
            .then(data => {
                if (data.result === 'success') {
                    responseMessage.innerText = data.message;
                    responseMessage.classList.remove('hidden');
                    form.reset();
                }
            })
            .finally(() => {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').innerText = '立即預約';
            });
        });
    </script>
</body>
</html>
