<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐廳預約系統</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; cursor: pointer; border: none; font-size: 16px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .full { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h2>線上訂位系統</h2>
    <p>2月開放日：2/14 (五), 2/15 (六)</p>

    <div id="booking-form">
        <div class="form-group">
            <label>選擇日期</label>
            <select id="date" onchange="checkAvailability()">
                <option value="2026-02-14">2026-02-14 (西洋情人節)</option>
                <option value="2026-02-15">2026-02-15</option>
            </select>
        </div>

        <div class="form-group">
            <label>選擇時段</label>
            <select id="time" onchange="checkAvailability()">
                <option value="17:30">17:30</option>
                <option value="20:00">20:00</option>
                <option value="22:30">22:30</option>
            </select>
            <span id="status-msg"></span>
        </div>

        <div class="form-group">
            <label>人數</label>
            <select id="guests">
                <option value="1">1位</option>
                <option value="2">2位</option>
                <option value="4">4位</option>
                <option value="4">4位</option>
                <option value="6">6位</option>
            </select>
        </div>

        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="name" placeholder="請輸入姓名" required>
        </div>

        <button id="submit-btn" onclick="submitBooking()">立即預約</button>
    </div>

    <script>
        // !!! 請將下方網址替換成你部署 GAS 後得到的 Web App URL !!!
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwbwPWvrw0l4KJHg1hRHdQUTrUp6ZAEmTRRZtcidX6kDdYt47-ILoTTTSeAuWZFq6FgxA/exec';

        // 頁面載入後自動檢查一次名額
        window.onload = checkAvailability;

        async function checkAvailability() {
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const statusMsg = document.getElementById('status-msg');
            const btn = document.getElementById('submit-btn');

            statusMsg.innerText = "讀取名額中...";
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                // 統計該時段已訂位人數
                const booked = (data.bookedData[date] && data.bookedData[date][time]) ? data.bookedData[date][time] : 0;
                const remaining = data.limit - booked;

                if (remaining <= 0) {
                    statusMsg.innerHTML = '<span class="full">已滿位</span>';
                    btn.disabled = true;
                } else {
                    statusMsg.innerText = `剩餘名額：${remaining}`;
                    btn.disabled = false;
                }
            } catch (e) {
                statusMsg.innerText = "無法取得名額資訊";
            }
        }

        async function submitBooking() {
            const btn = document.getElementById('submit-btn');
            const payload = {
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                guests: document.getElementById('guests').value,
                name: document.getElementById('name').value
            };

            if (!payload.name) { alert("請輸入姓名"); return; }

            btn.disabled = true;
            btn.innerText = "預約傳送中...";

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.result === 'success') {
                    alert("預約成功！我們準時見。");
                    location.reload(); 
                } else {
                    alert("錯誤：" + result.message);
                    checkAvailability();
                }
            } catch (e) {
                alert("傳送失敗，請稍後再試");
            } finally {
                btn.innerText = "立即預約";
            }
        }
    </script>
</body>
</html>
