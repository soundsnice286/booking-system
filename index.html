<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約訂位系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8f9fa; }
        .booking-card { max-width: 500px; margin: 2rem auto; }
        /* 保持訊息換行的樣式 */
        #responseMessage { white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body class="p-4">
    <div class="booking-card bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">預約訂位</h1>
        
        <form id="bookingForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">姓名</label>
                <input type="text" name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">電話</label>
                <input type="tel" name="phone" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">訂位日期</label>
                <select name="date" id="dateSelect" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
                    <option value="02-19">2月19日</option>
                    <option value="02-20">2月20日</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">訂位類別</label>
                <div class="flex gap-4 mt-2">
                    <label class="flex items-center">
                        <input type="radio" name="type" value="D" checked class="mr-2"> ☀️ 午場 (D)
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="type" value="N" class="mr-2"> 🌙 晚場 (N)
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">人數</label>
                <input type="number" name="guests" value="1" min="1" max="10" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">備註 (選填)</label>
                <textarea name="note" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition duration-200">
                立即預約
            </button>
        </form>

        <div id="responseMessage" class="hidden mt-6 p-4 bg-green-50 border border-green-200 text-green-800 rounded-lg text-sm"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzvADHxWUOHoIVmX2YYzzTrvEgVFpoTjD-xWXWxUyDjppCvidlQFTK3vocCQ5A5SMObxQ/exec';
        const form = document.getElementById('bookingForm');
        const submitBtn = document.getElementById('submitBtn');
        const responseMessage = document.getElementById('responseMessage');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = '處理中...';
            responseMessage.classList.add('hidden');

            const formData = new FormData(form);
            
            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        // 顯示成功訊息，並保持 GAS 傳回的換行格式
                        responseMessage.innerText = data.message;
                        responseMessage.classList.remove('hidden');
                        form.reset();
                        // 自動滾動到訊息位置
                        responseMessage.scrollIntoView({ behavior: 'smooth' });
                    } else {
                        throw new Error(data.error);
                    }
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('訂位失敗，請稍後再試或私訊告知。');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = '立即預約';
                });
        });
    </script>
</body>
</html>
