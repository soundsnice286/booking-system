<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>定位，好像不錯。</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; line-height: 1.6; }
    .loading { color: #888; font-style: italic; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #000; color: #fff; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:disabled { background-color: #ccc; }
    .status-msg { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <h2>預約訂位</h2>
  
  <div id="bookingForm">
    <div class="form-group">
      <label>訂位日期</label>
      <input type="date" id="date" required min="2026-02-10">
    </div>

    <div class="form-group">
      <label>時段</label>
      <select id="time" required>
        <option value="">請選擇日期...</option>
      </select>
      <div id="availability" class="loading">正在載入名額...</div>
    </div>

    <div class="form-group">
      <label>人數</label>
      <input type="number" id="guests" min="1" max="10" value="2" required>
    </div>

    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="name" placeholder="請輸入姓名" required>
    </div>

    <div class="form-group">
      <label>Instagram 帳號</label>
      <input type="text" id="ig" placeholder="例如: abc_123" required>
    </div>

    <button id="submitBtn">送出預約</button>
  </div>

  <div id="status" class="status-msg"></div>

  <script>
    // 這裡換成你最新的 GAS 部署網址 (WebApp URL)
    const API_URL = "https://script.google.com/macros/s/AKfycbxpzSDTtF4rgiaZpzFvdN6XsmvcDMCmAInXUr3FEv2TRt6Ib8XZz0RvoE8qFLym4MZHEA/exec";
    
    let bookedData = {};

    // 1. 初始化讀取名額
    async function fetchAvailability() {
      try {
        const response = await fetch(API_URL);
        const json = await response.json();
        bookedData = json.bookedData || {};
        document.getElementById('availability').innerText = "名額載入完成";
        updateOptions();
      } catch (e) {
        document.getElementById('availability').innerText = "載入失敗，請重新整理";
      }
    }

    // 2. 根據日期更新時段顯示
    function updateOptions() {
      const dateVal = document.getElementById('date').value;
      const timeSelect = document.getElementById('time');
      timeSelect.innerHTML = '<option value="">請選擇時段</option>';
      
      if (!dateVal) return;

      const sessions = ["17:30 - 21:00", "21:30 - 01:00"];
      sessions.forEach(s => {
        const booked = (bookedData[dateVal] && bookedData[dateVal][s]) ? 
                       (bookedData[dateVal][s].small + bookedData[dateVal][s].large) : 0;
        const option = document.createElement('option');
        option.value = s;
        option.innerText = `${s} (目前已預約 ${booked} 組)`;
        timeSelect.appendChild(option);
      });
    }

    document.getElementById('date').addEventListener('change', updateOptions);

    // 3. 送出表單
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const data = {
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        guests: document.getElementById('guests').value,
        name: document.getElementById('name').value,
        ig: document.getElementById('ig').value
      };

      if (!data.date || !data.time || !data.name || !data.ig) {
        alert("請完整填寫資料");
        return;
      }

      btn.disabled = true;
      btn.innerText = "傳送中...";
      status.style.display = "none";

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });
        status.innerText = "預約成功！我們將會私訊您的 Instagram 確認訂位。";
        status.className = "status-msg success";
        status.style.display = "block";
        document.getElementById('bookingForm').style.display = "none";
      } catch (e) {
        status.innerText = "連線失敗，請稍後再試。";
        status.className = "status-msg error";
        status.style.display = "block";
        btn.disabled = false;
        btn.innerText = "送出預約";
      }
    });

    fetchAvailability();
  </script>
</body>
</html>
