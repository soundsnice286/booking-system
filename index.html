<<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂位，好像不錯。</title>
    <style>
        body { font-family: -apple-system, sans-serif; color: #333; max-width: 500px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px; }
        ul { padding-left: 20px; font-size: 0.95rem; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: inline-block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .checkbox-container { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; cursor: pointer; }
        .checkbox-container input { width: auto; margin-top: 5px; }
        #submit-btn { width: 100%; padding: 15px; background: #333; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        #submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        #result-area { display: none; text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 3rem; color: #4caf50; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="booking-form">
        <h2>訂位，好像不錯。</h2>
        
        <h3>預約資訊</h3>
        <div class="form-group">
            <label>日期</label>
            <input type="date" id="date" onchange="updateOptions()">
        </div>
        
        <div class="form-group">
            <label>時段</label>
            <select id="time" onchange="updateGuestOptions()"></select>
        </div>

        <div class="form-group">
            <label>人數</label>
            <select id="guests" onchange="checkStatus()"></select>
        </div>

        <h3>聯繫資訊</h3>
        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="name" placeholder="請填寫姓名">
        </div>
        <div class="form-group">
            <label>Instagram ID</label>
            <input type="text" id="ig" placeholder="請填寫 IG ID（以便聯繫）">
        </div>

        <label class="checkbox-container">
            <input type="checkbox" id="agree" onchange="toggleSubmit()">
            <span>我已閱讀並同意上述訂位須知</span>
        </label>

        <button id="submit-btn" disabled onclick="submitForm()">請先勾選同意</button>
    </div>

    <div id="result-area">
        <div class="success-icon">✓</div>
        <h2 id="res-title">預約申請已送出</h2>
        <div id="res-success">
            <p>請留意 Instagram 訊息，我們將儘速與您確認。</p>
        </div>
        <div id="res-waitlist" style="display:none;">
            <p>目前此時段已額滿，您已進入候補名單。</p>
            <p>若有空位釋出，我們將依序聯繫。</p>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxTC2QppbqwsW3hKGDr_8SzArFgBFkAjQjuZHuzxjRo1t6P5J5311pdfgZxEDjyOhBr/exec"; 
        
        let apiData = {
            limits: { single: 2, small: 5, large: 3, fiveSix: 2 },
            bookedData: {}
        };

        window.onload = async () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
            document.getElementById('date').min = today;
            try {
                const res = await fetch(GAS_URL);
                if (res.ok) apiData = await res.json();
            } catch (e) { console.log("使用預設配置"); }
            updateOptions();
        };

        function updateOptions() {
            const dateVal = document.getElementById('date').value;
            const timeSelect = document.getElementById('time');
            const selectedTime = timeSelect.value;
            timeSelect.innerHTML = '';

            const sessions = ["16:30~19:00", "19:15~21:45", "22:00~00:30"];
            const booked = apiData.bookedData[dateVal] || {};
            const limits = apiData.limits;

            sessions.forEach(s => {
                const b = booked[s] || { single: 0, small: 0, large: 0, fiveSix: 0 };
                // 全時段額滿判斷：小桌和大桌都滿了
                const isAllFull = (b.small >= limits.small && b.large >= limits.large);
                const text = isAllFull ? s + " (該時段已額滿)" : s;
                timeSelect.add(new Option(text, s));
            });
            timeSelect.value = selectedTime || sessions[0];
            updateGuestOptions();
        }

        function updateGuestOptions() {
            const dateVal = document.getElementById('date').value;
            const timeVal = document.getElementById('time').value;
            const guestSelect = document.getElementById('guests');
            const selectedGuest = guestSelect.value;
            guestSelect.innerHTML = '';

            const booked = (apiData.bookedData[dateVal] && apiData.bookedData[dateVal][timeVal]) || { single: 0, small: 0, large: 0, fiveSix: 0 };
            const lim = apiData.limits;

            for (let i = 1; i <= 6; i++) {
                let isFull = false;
                if (i === 1) {
                    if (booked.single >= lim.single || booked.small >= lim.small) isFull = true;
                } else if (i === 2) {
                    if (booked.small >= lim.small) isFull = true;
                } else if (i === 3 || i === 4) {
                    if (booked.large >= lim.large) isFull = true;
                } else if (i >= 5) {
                    if (booked.fiveSix >= lim.fiveSix || booked.large >= lim.large) isFull = true;
                }

                const label = i + " 位" + (i === 1 ? " (吧檯座位)" : "");
                const optionText = isFull ? label + " ：已額滿，我要候補。" : label;
                const opt = new Option(optionText, i);
                guestSelect.add(opt);
            }
            guestSelect.value = selectedGuest || "2";
            checkStatus();
        }

        function checkStatus() {
            const guestSelect = document.getElementById('guests');
            const btn = document.getElementById('submit-btn');
            const selectedOptText = guestSelect.options[guestSelect.selectedIndex]?.text || "";
            if (selectedOptText.includes("已額滿")) {
                btn.innerText = "我要候補";
            } else {
                btn.innerText = "確認預約";
            }
            toggleSubmit();
        }

        function toggleSubmit() {
            const btn = document.getElementById('submit-btn');
            const agreeCheck = document.getElementById('agree');
            btn.disabled = !agreeCheck.checked;
        }

        async function submitForm() {
            const btn = document.getElementById('submit-btn');
            const payload = {
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                guests: document.getElementById('guests').value,
                name: document.getElementById('name').value,
                ig: document.getElementById('ig').value
            };
            if (!payload.name || !payload.ig) { alert("請填寫姓名與 Instagram ID"); return; }

            const isWaitlist = (btn.innerText === "我要候補");
            btn.disabled = true;
            btn.innerText = "處理中...";
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                document.getElementById('booking-form').style.display = 'none';
                document.getElementById('result-area').style.display = 'block';
                if (isWaitlist) {
                    document.getElementById('res-title').innerText = "已為您安排候補";
                    document.getElementById('res-success').style.display = 'none';
                    document.getElementById('res-waitlist').style.display = 'block';
                }
            } catch (e) {
                alert("預約失敗");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
